<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title></title>

    <!--put your external stylesheet links here-->
    <link rel="stylesheet" href="css/style.css">
    <!--[if IE<9]>
            <link rel="stylesheet" href="css/style.ie.css">
        <![endif]-->

    <!--you can also place internal styles here;
             place these within <style> tags-->

</head>

<body>
    <!--put your initial page content here-->
    <div id="map-container">
        <!-- D3.js will insert the map here -->
        <div class="chart-container">
            <svg id="map"></svg>
        </div>
        <div id="dropdown"></div>
        <div class="chart-container">
            <svg align="center" id="barchart"></svg>
        </div>
        <br><br>
    </div>

    <!-- Data source attribution in its own container at the bottom -->
    <div id="data-container">
        <p id="data-attribution">
            Data sources: <a href="https://www.ncei.noaa.gov/" target="_blank">National Centers for Environmental
                Information (NCEI)</a> and
            <a href="https://www.naturalearthdata.com/" target="_blank">Natural Earth</a>. Map data available at these
            websites.
        </p>
    </div>

    <!-- External scripts -->
    <script type="text/javascript" src="lib/d3.v7.js"></script>
    <script src="https://d3js.org/topojson.v3.min.js"></script>
    <script type="text/javascript" src="js/main.js"></script>
</body>

</html>
